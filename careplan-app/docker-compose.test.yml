services:
  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: careplan_test
      POSTGRES_USER: careplan_test
      POSTGRES_PASSWORD: careplan_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careplan_test -d careplan_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis_test:
    image: redis:7-alpine

  test:
    build: .
    command: >
      sh -c "python manage.py migrate --run-syncdb &&
             pytest careplan_app/tests/ -v
               --cov=careplan_app
               --cov-report=term-missing
               --cov-fail-under=90"
    environment:
      POSTGRES_DB: careplan_test
      POSTGRES_USER: careplan_test
      POSTGRES_PASSWORD: careplan_test
      POSTGRES_HOST: db_test
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis_test:6379/1
      MOCK_LLM: "1"
      DJANGO_DEBUG: "True"
      DJANGO_SETTINGS_MODULE: careplan_project.settings
      CLAUDE_API_KEY: "test-key-not-used"
    depends_on:
      db_test:
        condition: service_healthy
      redis_test:
        condition: service_started
    volumes:
      - .:/app
